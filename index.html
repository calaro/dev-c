                stage.score = parseInt(val);
                const textEl = document.getElementById(`panel-score-val-${id}`);
                if (textEl) textEl.innerText = val + "分";
                renderEmotionCurve();
            }
        }

        function renderEmotionCurve() {
            const points = stages.map((s, idx) => {
                const x = (columnWidth / 2) + (idx * columnWidth);
                const y = height - (s.score / 10) * (height - 40) - 20;
                return { x, y, id: s.id, score: s.score };
            });

            // Calculate SVG smooth Cubic Bezier Path
            let pathD = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                const prev = points[i-1];
                const curr = points[i];
                const cpX1 = prev.x + (columnWidth / 3);
                const cpY1 = prev.y;
                const cpX2 = curr.x - (columnWidth / 3);
                const cpY2 = curr.y;
                pathD += ` C ${cpX1} ${cpY1}, ${cpX2} ${cpY2}, ${curr.x} ${curr.y}`;
            }

            // Apply Path attributes
            document.getElementById('curve-path').setAttribute('d', pathD);
            document.getElementById('curve-glow').setAttribute('d', pathD);
            document.getElementById('curve-fill').setAttribute('d', `${pathD} L ${points[points.length-1].x} 180 L ${points[0].x} 180 Z`);

            // Reposition score bubbles and update text dynamically
            points.forEach(pt => {
                const bubble = document.getElementById('score-bubble-' + pt.id);
                const emoji = document.getElementById('emoji-' + pt.id);
                if (bubble) {
                    bubble.style.transform = `translateY(${pt.y - 68}px)`;
                    bubble.querySelector('.score-val').innerText = pt.score;
                }
                if (emoji) {
                    emoji.style.transform = `translateY(${pt.y - 2}px)`;
                    emoji.innerText = getEmoji(pt.score);
                }
            });
        }

        // --- 8. SMOOTH ARROW CLICK SCROLL FUNCTION (往右/往左點擊滾動) ---
        function scrollJourney(direction) {
            const container = document.getElementById('journey-scroll-viewport');
            if (!container) return;
            
            // Scroll by exactly 3 columns (3 * 230px = 690px)
            const scrollAmount = columnWidth * 3;
            
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        // Dynamic hide/show of left/right arrow hints based on real scroll status
        function updateScrollButtons() {
            const container = document.getElementById('journey-scroll-viewport');
            const leftBtn = document.getElementById('scroll-btn-left');
            const rightBtn = document.getElementById('scroll-btn-right');
            const textHint = document.getElementById('scroll-text-hint');
            
            if (!container || !leftBtn || !rightBtn || !textHint) return;

            // 1. Left Arrow visibility
            if (container.scrollLeft > 30) {
                leftBtn.style.opacity = '1';
                leftBtn.style.pointerEvents = 'auto';
            } else {
                leftBtn.style.opacity = '0';
                leftBtn.style.pointerEvents = 'none';
            }

            // 2. Right Arrow & Slide Text Hint visibility
            const isAtEnd = container.scrollLeft + container.clientWidth >= container.scrollWidth - 30;
            if (isAtEnd) {
                rightBtn.style.opacity = '0';
                rightBtn.style.pointerEvents = 'none';
                textHint.style.opacity = '0';
            } else {
                rightBtn.style.opacity = '1';
                rightBtn.style.pointerEvents = 'auto';
                
                // Show hint text only if we haven't scrolled much to the right yet
                if (container.scrollLeft < 150) {
                    textHint.style.opacity = '1';
                } else {
                    textHint.style.opacity = '0';
                }
            }
        }

        // --- 9. HIGH-RESOLUTION EXPORT ENGINE (JPG / PDF) ---
        function downloadFullMap() {
            const scrollContainer = document.getElementById('journey-scroll-viewport');
            const mapContainer = document.getElementById('full-journey-canvas');
            const btn = document.querySelector('button[onclick="downloadFullMap()"]');
            
            if (!scrollContainer || !mapContainer || !btn) return;

            // Show Loading state
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 正在生成地圖 (請稍候)...`;
            btn.disabled = true;

            // Check if html2canvas loaded successfully
            if (typeof html2canvas === 'undefined') {
                alert("💡 由於安全原則阻擋自動下載，請嘗試直接對網頁點擊右鍵列印，將檔案匯出為 PDF！");
                window.print();
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                return;
            }

            // Force the scrollable table area to be completely visible horizontally during render
            const originalScrollStyle = scrollContainer.style.overflowX;
            scrollContainer.style.overflowX = 'visible';

            // Wait brief moment for layout updates before capturing
            setTimeout(() => {
                html2canvas(mapContainer, {
                    useCORS: true,
                    scale: 1.5, // Crisp export scale
                    backgroundColor: '#FAFAFA',
                    logging: false
                }).then(canvas => {
                    // Restore original scroll style
                    scrollContainer.style.overflowX = originalScrollStyle;

                    // Get high quality JPG base64 data
                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    const filename = `永豐金大戶投_使用者旅程地圖_${roles[currentRole].name}.jpg`;

                    try {
                        // Attempt Direct download
                        const link = document.createElement('a');
                        link.download = filename;
                        link.href = imgData;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    } catch (downloadErr) {
                        // Sandbox Fallback: Open in new window for Right-Click Save
                        console.warn("Direct download restricted by browser sandbox. Opening fallback image window...");
                        const newWindow = window.open();
                        if (newWindow) {
                            newWindow.document.write(`
                                <html>
                                <head><title>永豐金大戶投 - 下載地圖</title></head>
                                <body style="margin:0; background:#FAFAFA; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; padding:30px;">
                                    <div style="background:#FFF176; padding:15px 30px; border-radius:10px; font-weight:bold; margin-bottom:20px; box-shadow:0 4px 10px rgba(0,0,0,0.06); text-align:center;">
                                        🎉 旅程地圖已完美生成！請在下方「圖片上點擊右鍵」選擇「另存圖片」即可儲存為 ${filename}！
                                    </div>
                                    <img src="${imgData}" style="max-width:100%; border:1px solid #D6D6D6; box-shadow:0 12px 30px rgba(0,0,0,0.1); border-radius:4px;" />
                                </body>
                                </html>
                            `);
                        } else {
                            alert("新分頁被瀏覽器阻擋，請開啟彈出式視窗權限，或直接對網頁點擊右鍵列印。");
                        }
                    }

                    // Restore button state
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }).catch(err => {
                    console.error("Export failed", err);
                    scrollContainer.style.overflowX = originalScrollStyle;
                    alert("💡 瀏覽器阻擋了 Canvas 生成。為您自動開啟列印面板，可以直接將整張圖「儲存為 PDF」。");
                    window.print();
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                });
            }, 100);
        }

        // --- 10. INITIAL-SCALE OVERRIDE ENGINE FOR SLIDER ---
        function adjustMapFontSize(val) {
            let styleTag = document.getElementById('dynamic-font-style');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'dynamic-font-style';
                document.head.appendChild(styleTag);
            }
            
            // Scalable CSS mapping based on slider value (10 to 20) (預設大型化放大優化)
            const baseSize = parseInt(val);
            styleTag.innerHTML = `
                #full-journey-canvas .text-sm { font-size: ${baseSize + 2}px !important; }
                #full-journey-canvas .text-xs { font-size: ${baseSize}px !important; }
                #full-journey-canvas .text-\\[13px\\] { font-size: ${baseSize + 1}px !important; }
                #full-journey-canvas li { font-size: ${baseSize + 1}px !important; }
                #full-journey-canvas .text-sm.font-bold { font-size: ${baseSize + 2}px !important; }
            `;
        }

        // Load initially
        window.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            initMap();
            adjustMapFontSize(15); // Run font scaling on startup (預設開啟 15 號極清晰大字體)
        });
    </script>

</body></html>
